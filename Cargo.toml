[package]
name = "ledzilla_server"
version = "0.1.0"
edition = "2024"

[features]
# default = ["simulator", "led"]
simulator = ["dep:embedded-graphics-simulator"]
led = ["dep:rpi-led-panel"]

[dependencies]
anyhow = "1.0.104"
colorgrad = "0.8.0"
embedded-graphics = "0.8.2"
embedded-graphics-simulator = { version = "0.8.0", optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
] }
log = "0.4.33"
rouille = { version = "3.6.2", default-features = false }
rpi-led-panel = { version = "0.8.1", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = "3.21.0"
simple_logger = "5.2.0"
strum = "0.28.0"
strum_macros = "0.28.0"
thiserror = "2.0.19"
time = "0.3.53"
toml = "1.1.4"

[profile.release]
lto = true
