<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEDzilla</title>
  <link rel="stylesheet" href="ledzilla.css" />
</head>
<body>

<header>
  <h1>LEDzilla</h1>
</header>

<main>
  <section id="component-panel">
    <div class="panel-header">
      <h2>Components</h2>
    </div>

    <div id="component-list"></div>
    <div id="empty-state">
      <span class="icon">▣</span>
      <span>No components yet — add one below</span>
    </div>

    <hr />
    <div class="panel-header"><h2>Add component</h2></div>
    <div id="add-component">
      <!-- populated from COMPONENT_TYPES -->
    </div>
  </section>

  <aside id="sidebar">
    <div class="sidebar-section">
      <h2>Display info</h2>
      <div id="display-info">—</div>
    </div>

    <div class="sidebar-section">
      <h2>Display power</h2>
      <div class="controls-row">
        <button class="btn btn-on"  onclick="api.displayOn()">Turn on</button>
        <button class="btn btn-off" onclick="api.displayOff()">Turn off</button>
      </div>
    </div>

    <div class="sidebar-section">
      <h2>State</h2>
      <button class="btn btn-primary"   onclick="api.pushState()">Push state to display</button>
      <button class="btn btn-secondary" onclick="api.getState()">Pull state from display</button>
    </div>

    <div class="sidebar-section" style="flex:1;display:flex;flex-direction:column;">
      <h2>Activity log</h2>
      <div id="log"></div>
    </div>
  </aside>
</main>

<script src="ledzilla.js"></script>
</body>
</html>
